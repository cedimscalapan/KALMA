name: Train KALMA SmolLM2-135M V2
on:
  push:
    branches: [main]
    paths:
      - 'training/v2/**'
      - '.github/workflows/train-kalma-v2.yml'
  workflow_dispatch:
jobs:
  train-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      KALMA_STEPS: '120'
      KALMA_MAXLEN: '384'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dataset licensing and data preparation unit tests
        run: python -m unittest discover -s training/v2 -p 'test_*.py' -v
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install ML dependencies
        run: python -m pip install 'transformers==4.46.3' 'peft==0.14.0' 'accelerate==1.2.1' 'datasets==3.2.0' 'huggingface_hub>=0.26,<1.0' safetensors sentencepiece protobuf
      - name: Train LoRA with approved datasets
        run: python training/v2/train.py
      - name: Convert GGUF and quantize
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/kalma-llama
          python -m pip install 'gguf>=0.17' numpy
          python /tmp/kalma-llama/convert_hf_to_gguf.py training/v2/output/merged --outfile training/v2/output/KALMA-V2-f16.gguf --outtype f16
          cmake -S /tmp/kalma-llama -B /tmp/kalma-llama/build -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/kalma-llama/build --config Release -j 4 --target llama-quantize llama-cli
          /tmp/kalma-llama/build/bin/llama-quantize training/v2/output/KALMA-V2-f16.gguf training/v2/output/KALMA-SmolLM2-135M-V2-Q4_0.gguf Q4_0
      - name: GGUF inference smoke test
        run: |
          /tmp/kalma-llama/build/bin/llama-cli -m training/v2/output/KALMA-SmolLM2-135M-V2-Q4_0.gguf -p 'Hi, how are you?' -n 32 -c 512 --no-display-prompt > training/v2/output/smoke_test.txt
          test -s training/v2/output/smoke_test.txt
          grep -q '[A-Za-z]' training/v2/output/smoke_test.txt
      - name: Save diagnostics and adapter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalma-v2-training-reports
          path: |
            training/v2/output/dataset_manifest.json
            training/v2/output/license_audit.json
            training/v2/output/training_report.json
            training/v2/output/MODEL_CARD.md
            training/v2/output/adapter
            training/v2/output/smoke_test.txt
          if-no-files-found: warn
      - name: Publish GGUF artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KALMA-SmolLM2-135M-V2-Q4_0
          path: |
            training/v2/output/KALMA-SmolLM2-135M-V2-Q4_0.gguf
            training/v2/output/training_report.json
            training/v2/output/MODEL_CARD.md
          retention-days: 30
