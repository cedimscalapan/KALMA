name: Train KALMA SmolLM2-135M (experimental CPU)
on:
  push:
    branches: [main]
    paths:
      - 'training/train_smollm2.py'
      - '.github/workflows/train-kalma-smollm2.yml'
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install training packages
        run: python -m pip install 'transformers==4.46.3' 'peft==0.14.0' 'accelerate==1.2.1' 'datasets==3.2.0' 'huggingface_hub>=0.26,<1.0' safetensors sentencepiece protobuf
      - name: Train LoRA with openly licensed public conversations
        run: python training/train_smollm2.py
      - name: Convert merged model to GGUF
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/kalma-llama
          python -m pip install 'gguf>=0.17' numpy
          python /tmp/kalma-llama/convert_hf_to_gguf.py training/output/merged --outfile training/output/KALMA-f16.gguf --outtype f16
          cmake -S /tmp/kalma-llama -B /tmp/kalma-llama/build -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/kalma-llama/build --config Release -j 4 --target llama-quantize
          /tmp/kalma-llama/build/bin/llama-quantize training/output/KALMA-f16.gguf training/output/KALMA-SmolLM2-135M-Q4_0.gguf Q4_0
      - name: Upload adapter and reports even if export fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalma-training-metrics-adapter
          path: |
            training/output/adapter/
            training/output/training_report.json
            training/output/dataset_manifest.json
          if-no-files-found: warn
      - name: Upload KALMA GGUF model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KALMA-SmolLM2-135M-Q4_0
          path: |
            training/output/KALMA-SmolLM2-135M-Q4_0.gguf
            training/output/training_report.json
            training/output/dataset_manifest.json
          retention-days: 30
